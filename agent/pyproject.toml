[project]
name = "fish-voice-agent"
version = "0.1.0"
description = "LiveKit voice agent using Fish Audio TTS"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents>=1.5.0",
  "livekit-plugins-fishaudio>=1.5.0",
  "livekit-plugins-openai>=1.5.0",
  "livekit-plugins-silero>=1.5.0",
  "livekit-plugins-turn-detector>=1.5.0",
  "livekit-plugins-xai>=1.5.0",
  "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
  "pyright>=1.1.407",
  "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
