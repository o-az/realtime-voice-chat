[project]
name = "fvc-realtime"
version = "0.1.0"
description = "FastAPI realtime voice backend using Pipecat, Daily, xAI, and Fish Audio"
requires-python = ">=3.14.5"
dependencies = [
  "aiohttp>=3.13.2",
  "fastapi>=0.124.0",
  "pipecat-ai[daily,fish,runner,silero,xai]>=1.3.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.38.0"
]

[dependency-groups]
dev = ["pyrefly>=1.0.0", "ruff>=0.14.0"]

[tool.pyrefly]
package = false
search_path = ["."]

[tool.ruff]
line-length = 100
