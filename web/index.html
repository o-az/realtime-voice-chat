<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Fish Voice Chat</title>
  </head>
  <body>
    <main>
      <section class="call">
        <div class="status-row">
          <span
            id="status-dot"
            aria-hidden="true"></span>
          <p id="status">Disconnected</p>
        </div>

        <label>
          Room
          <input
            id="room"
            autocorrect="off"
            autocomplete="off"
            spellcheck="false"
            autocapitalize="off" />
        </label>

        <label>
          Fish voice ID
          <input
            autocorrect="off"
            autocomplete="off"
            spellcheck="false"
            autocapitalize="off"
            id="voice-id"
            autocomplete="off" />
        </label>

        <div class="actions">
          <button
            id="connect"
            type="button">
            Connect
          </button>
          <button
            id="disconnect"
            type="button"
            disabled>
            Disconnect
          </button>
        </div>

        <div
          class="control-menu"
          aria-label="Call controls">
          <button
            id="mute"
            class="icon-button"
            type="button"
            disabled
            aria-pressed="false"
            aria-label="Mute microphone"
            title="Mute microphone">
            <svg
              class="mic-icon"
              aria-hidden="true"
              viewBox="0 0 24 24">
              <path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z" />
              <path d="M5 10v1a7 7 0 0 0 14 0v-1" />
              <path d="M12 18v3" />
              <path d="M8 21h8" />
            </svg>
          </button>
        </div>

        <audio
          id="remote-audio"
          autoplay
          playsinline></audio>
      </section>

      <section
        class="transcript"
        aria-label="Live transcript">
        <div
          id="transcript-lines"
          class="transcript-lines"></div>
      </section>
    </main>
    <script
      type="module"
      src="/src/main.ts"></script>
  </body>
</html>
